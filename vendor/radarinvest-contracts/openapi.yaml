          type: string
          enum: [OK, NO_SOLUTION, NOT_APPLICABLE, UNAVAILABLE]
          nullable: true
        method:
          type: string
          enum: [TWR_EVENT, TWR_UNAVAILABLE]
          description: Método TWR aplicado neste recorte
        coverage:
          type: object
          required: [status, bases, limitations]
          properties:
            status:
              type: string
              enum:
                - OK
                - INSUFFICIENT_HISTORY
                - COST_UNKNOWN
                - PARTIAL_COVERAGE
                - UNAVAILABLE
            bases:
              type: array
              items:
                type: string
                enum: [EQUITY_CLOSE, FIXED_INCOME_CARRY, TREASURY_PU, CASH]
              description: Bases de avaliação incluídas no V usado
            effectiveFrom:
              type: string
              format: date
              nullable: true
            effectiveTo:
              type: string
              format: date
              nullable: true
            limitations:
              type: array
              items:
                type: string
