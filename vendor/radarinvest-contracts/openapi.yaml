    TreasuryCouponAgenda:
      type: object
      required: [lotId, couponRatePercentAa, items]
      properties:
        lotId:
          type: string
          format: uuid
        couponRatePercentAa:
          $ref: "#/components/schemas/Decimal"
        couponSemestralPercent:
          $ref: "#/components/schemas/Decimal"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TreasuryCouponAgendaItem"
    TreasuryAmortizationReceiptCreate:
      type: object
      required: [grossReceived]
      properties:
        receivedDate:
          type: string
          format: date
        grossReceived:
          $ref: "#/components/schemas/Decimal"
        netReceived:
          $ref: "#/components/schemas/Decimal"
          nullable: true
    TreasuryAmortizationReceipt:
      type: object
      required:
