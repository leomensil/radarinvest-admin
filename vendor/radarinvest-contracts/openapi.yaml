      type: string
      enum: [OPEN, CLOSED, SETTLED]
    TreasuryEvaluationQuality:
      type: string
      enum:
        [
          COST,
          CARRY_CONTRACTED,
          CARRY_AT_FACE,
          CARRY_AT_VNA,
          OFFICIAL_REDEEM_PU,
          ETTJ_ESTIMATE,
          MISSING,
          GAP,
          STALE,
          UNSUPPORTED_PROJECTION,
        ]
    TreasuryEvaluationMeta:
      type: object
      required: [basis, quality, asOf]
      properties:
        basis:
          type: string
          enum: [COST, CARRY, MARKET, ETTJ]
        quality:
          $ref: "#/components/schemas/TreasuryEvaluationQuality"
        asOf:
          type: string
          format: date
        source:
          type: string
          nullable: true
        observedAt:
          type: string
          format: date
          nullable: true
        curveDate:
          type: string
          format: date
          nullable: true
        reason:
          type: string
          nullable: true
          description: Motivo de incompletude daquela base (independente das outras)
    TreasuryLotCreate:
      type: object
      required:
        - species
        - bondLabel
        - maturityDate
        - tradeDate
        - quantity
        - acquisitionPu
        - contractedRatePercentAa
        - custodian
      properties:
        species:
          $ref: "#/components/schemas/TreasurySpecies"
        bondLabel:
          type: string
          example: Tesouro Prefixado 2031
        maturityDate:
          type: string
          format: date
        lotCode:
          type: string
          nullable: true
        tradeDate:
          type: string
          format: date
        quantity:
          $ref: "#/components/schemas/Decimal"
        acquisitionPu:
          $ref: "#/components/schemas/Decimal"
        contractedRatePercentAa:
          $ref: "#/components/schemas/Decimal"
          description: >
            Prefixado: taxa contratada % a.a. 252 (>0).
            Selic: taxa de ágio/deságio % a.a. 252 (0=par; >0 deságio; <0 ágio).
            IPCA_PLUS: taxa real contratada % a.a. 252.
            PREFIXADO_COUPON: TIR de aquisição % a.a. 252 (≠ taxa do cupom 10%).
            IPCA_PLUS_COUPON: TIR real de aquisição % a.a. 252 (≠ cupom 6%).
            RENDA_MAIS / EDUCA_MAIS: TIR real de aquisição % a.a. 252 (≠ Ta/Taf).
            MUST NOT ipcaLagMonths / emissão casada CDB — se presentes no body:
            422 UNSUPPORTED_CDB_CONVENTION.
        conversionDate:
          type: string
          format: date
          description: >
            RENDA_MAIS / EDUCA_MAIS obrigatório; dia civil 15.
            RendA+: 240 parcelas, span 239 meses. Educa+: 60 parcelas, span 59 meses.
            Distinto de maturityDate (último pagamento). Span errado →
            422 UNSUPPORTED_TREASURY_AMORT_CALENDAR. Null nas outras espécies.
        couponRatePercentAa:
          $ref: "#/components/schemas/Decimal"
          description: >
            NTN-F: omitir ou 10. NTN-B cupom: omitir ou 6.
            Outro valor → 422 UNSUPPORTED_TREASURY_COUPON_RATE.
            MUST NOT derivar da taxa de aquisição.
        vnaBaseDate:
          type: string
          format: date
          description: >
            SELIC default 2000-07-01; IPCA_PLUS default 2000-07-15; omitir em PREFIXADO_ZERO
        costs:
          $ref: "#/components/schemas/Decimal"
        grossAmount:
          $ref: "#/components/schemas/Decimal"
        grossAmountOrigin:
          type: string
          enum: [INFORMED, DERIVED]
        custodian:
          type: string
          description: Código B3 da IF
    TreasuryLotRedeem:
      type: object
      required: [tradeDate, quantity, grossReceived]
      properties:
        tradeDate:
          type: string
          format: date
        quantity:
          $ref: "#/components/schemas/Decimal"
        grossReceived:
          $ref: "#/components/schemas/Decimal"
        netReceived:
          $ref: "#/components/schemas/Decimal"
          nullable: true
    TreasuryLotSettle:
      type: object
      required: [tradeDate, grossReceived]
      properties:
        tradeDate:
          type: string
          format: date
        grossReceived:
          $ref: "#/components/schemas/Decimal"
          description: >
            Principal informado. NTN-F/NTN-B com cupom: não inclui o cupom de
            vencimento (recibo próprio). MUST NOT inferir split de um total misto.
        netReceived:
          $ref: "#/components/schemas/Decimal"
          nullable: true
    TreasuryCouponReceiptCreate:
      type: object
      required: [grossReceived]
      properties:
        receivedDate:
          type: string
          format: date
          description: Data de crédito informada; default = pagamento ajustado
        grossReceived:
          $ref: "#/components/schemas/Decimal"
        netReceived:
          $ref: "#/components/schemas/Decimal"
          nullable: true
    TreasuryCouponReceipt:
