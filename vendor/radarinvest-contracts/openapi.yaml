        id:
          type: string
          format: uuid
        portfolioId:
          type: string
          format: uuid
        lotId:
          type: string
          format: uuid
        nominalDate:
          type: string
          format: date
        adjustedPaymentDate:
          type: string
          format: date
        predictedGross:
          $ref: "#/components/schemas/Decimal"
        grossReceived:
          $ref: "#/components/schemas/Decimal"
        netReceived:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        variance:
          $ref: "#/components/schemas/Decimal"
        status:
          type: string
          enum: [CREDITED]
        creditedAt:
          type: string
          format: date-time
    TreasuryCouponAgendaItem:
