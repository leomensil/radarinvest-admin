          $ref: "#/components/schemas/Decimal"
        grossReceived:
          $ref: "#/components/schemas/Decimal"
        netReceived:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        carryVariance:
          $ref: "#/components/schemas/Decimal"
          nullable: true
    TreasuryLot:
      type: object
      required:
        - id
