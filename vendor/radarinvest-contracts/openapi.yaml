        nominalDate:
          type: string
          format: date
        adjustedPaymentDate:
          type: string
          format: date
        taRate:
          $ref: "#/components/schemas/Decimal"
        predictedGross:
          $ref: "#/components/schemas/Decimal"
        grossReceived:
          $ref: "#/components/schemas/Decimal"
        netReceived:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        variance:
          $ref: "#/components/schemas/Decimal"
        status:
          type: string
          enum: [CREDITED]
        creditedAt:
          type: string
          format: date-time
    TreasuryAmortizationAgendaItem:
      type: object
      required:
        - installmentIndex
        - nominalDate
        - adjustedPaymentDate
        - taRate
        - contractual
        - eligible
        - predictedGross
        - remainingInCarry
        - state
      properties:
        installmentIndex:
          type: integer
