        - bondLabel
        - maturityDate
        - tradeDate
        - quantityAcquired
        - remainingQuantity
        - acquisitionPu
        - contractedRatePercentAa
        - costs
        - grossAmount
        - custodian
        - status
        - costBasis
        - carryPu
        - carryValue
        - marketPu
        - marketValue
        - ettjPu
        - ettjValue
        - evaluations
        - events
        - limitations
      properties:
        id:
          type: string
          format: uuid
        portfolioId:
          type: string
          format: uuid
        species:
          $ref: "#/components/schemas/TreasurySpecies"
        bondLabel:
          type: string
        maturityDate:
          type: string
          format: date
        lotCode:
          type: string
          nullable: true
        tradeDate:
          type: string
          format: date
        quantityAcquired:
          $ref: "#/components/schemas/Decimal"
        remainingQuantity:
          $ref: "#/components/schemas/Decimal"
        acquisitionPu:
          $ref: "#/components/schemas/Decimal"
        contractedRatePercentAa:
          $ref: "#/components/schemas/Decimal"
        vnaBaseDate:
          type: string
          format: date
          nullable: true
          description: SELIC default 2000-07-01; IPCA_PLUS default 2000-07-15; null em PREFIXADO_ZERO
        costs:
          $ref: "#/components/schemas/Decimal"
        grossAmount:
          $ref: "#/components/schemas/Decimal"
        grossAmountOrigin:
          type: string
          enum: [INFORMED, DERIVED]
        custodian:
          type: string
        status:
          $ref: "#/components/schemas/TreasuryLotStatus"
        settledAt:
          type: string
          format: date-time
          nullable: true
        costBasis:
          $ref: "#/components/schemas/Decimal"
        carryPu:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: Null quando carrego GAP/STALE/UNSUPPORTED_PROJECTION (Selic ou IPCA+)
        carryValue:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        vna:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: VNA Selic/IPCA+ na asOf; null se GAP/UNSUPPORTED ou espécie sem VNA
        quotation:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: Cotação % do VNA (Selic/IPCA+); null se GAP/UNSUPPORTED
        incompletenessReasons:
          type: array
          items:
            type: string
          description: >
            Motivos por lote. treasuryIncompleteCount usa só ausência de PU oficial
            em OPEN (MARKET_PU_MISSING), não carrego GAP.
        seriesThrough:
          type: string
          format: date
          nullable: true
          description: >
            SELIC: último DU com SELIC_OVER_AA_252 ≤ asOf.
            IPCA_PLUS: último mês de referência IPCA_NI oficial utilizável ≤ asOf
            (YYYY-MM-01). Null se nenhum oficial.
        marketPu:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: PU oficial de resgate/venda (Tesouro Transparente PU Venda Manhã); null se ausente
        marketValue:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        marketPuProvenance:
          $ref: "#/components/schemas/Provenance"
          nullable: true
        marketPuDate:
          type: string
          format: date
          nullable: true
          description: Data Base efectiva do PU usado (≤ asOf); null se MISSING. Não inventar como preço do dia asOf se STALE.
        ettjPu:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: Estimativa NSS — não é PU oficial de resgate
        ettjValue:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        evaluations:
          type: object
          required: [cost, carry, market, ettj]
          properties:
            cost:
              $ref: "#/components/schemas/TreasuryEvaluationMeta"
            carry:
              $ref: "#/components/schemas/TreasuryEvaluationMeta"
            market:
              $ref: "#/components/schemas/TreasuryEvaluationMeta"
            ettj:
              $ref: "#/components/schemas/TreasuryEvaluationMeta"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TreasuryLotEvent"
        conversionDate:
          type: string
          format: date
          nullable: true
        phase:
          type: string
          enum: [ACCUMULATION, RECEIPT, ENDED_SCHEDULE]
          nullable: true
          description: RENDA_MAIS / EDUCA_MAIS; null nas restantes
        remainingAmortPercent:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: Soma Ta/Taf com adjusted > asOf (sobre 100 original)
        couponAgenda:
          $ref: "#/components/schemas/TreasuryCouponAgenda"
          nullable: true
          description: Presente em PREFIXADO_COUPON / IPCA_PLUS_COUPON; null nas restantes
        amortAgenda:
          $ref: "#/components/schemas/TreasuryAmortizationAgenda"
          nullable: true
          description: Presente em RENDA_MAIS / EDUCA_MAIS; null nas restantes
        couponRatePercentAa:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: 10 em NTN-F; null nas espécies sem cupom
        limitations:
          type: array
          items:
            type: string
          description: Espécies fora do corte e avisos (fixture vs produção)
        calendarReview:
          type: object
          description: >
            Calendário DU do carrego TPF (`ANBIMA_NATIONAL`): feriados nacionais ANBIMA
            (sem 25-Jan SP/B3); asOf/liquidação inclusive, maturity exclusive (Metodologia LTN).
            `maturityDate` = vencimento nominal (≠ data ajustada de pagamento).
          properties:
            calendar:
              type: string
              enum: [ANBIMA_NATIONAL]
            source:
              type: string
            inclusiveAsOf:
              type: boolean
            exclusiveMaturity:
              type: boolean
            coverageNote:
              type: string
            asOf:
              type: string
              format: date
            maturityDate:
              type: string
              format: date
            du:
              type: integer
            postMaturity:
              type: boolean
        acquisitionReview:
          type: object
          description: PU aquisição vs carrego teórico na tradeDate (diferença registrada; não força igualdade)
          properties:
            calendar:
              type: string
              enum: [ANBIMA_NATIONAL]
            duAtTrade:
              type: integer
            theoreticalCarryPu:
              $ref: "#/components/schemas/Decimal"
            acquisitionPu:
              $ref: "#/components/schemas/Decimal"
            acquisitionCarryDifference:
              $ref: "#/components/schemas/Decimal"
    FixedIncomeInstrumentType:
