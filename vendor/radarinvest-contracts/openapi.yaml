      tags: [admin]
      operationId: getAdminOpsOverview
      summary: Visão operacional (fontes, jobs recentes, audit; cron prod off)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOpsOverview"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/capabilities:
    get:
      tags: [admin]
      operationId: listAdminCapabilities
      summary: Painel de capacidades (enabled ≠ homologated)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCapabilityStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/audit:
    get:
      tags: [admin]
      operationId: listAdminAudit
      summary: Trilha de auditoria administrativa (segredos redacted)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAuditEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/data-sources:
    get:
      tags: [admin]
      operationId: listAdminDataSources
      summary: Lista fontes de dados (credenciais mascaradas)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminDataSourceView"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: createAdminDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDataSourceUpsert"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataSourceView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/data-sources/{sourceId}:
    patch:
      tags: [admin]
      operationId: updateAdminDataSource
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDataSourceUpsert"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataSourceView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/data-sources/{sourceId}/test:
    post:
      tags: [admin]
      operationId: testAdminDataSource
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resultado do teste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConnectionTestResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/feature-matrix:
    get:
      tags: [admin]
      operationId: getAdminFeatureMatrix
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminFeatureRoutingView"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [admin]
      operationId: updateAdminFeatureMatrix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AdminFeatureRoutingUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminFeatureRoutingView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/series-ingest/runs:
    get:
      tags: [admin]
      operationId: listAdminSeriesIngestRuns
      summary: Lista corridas de ingestão de séries (SUPER_ADMIN)
      parameters:
        - name: capability
          in: query
          schema:
            type: string
            enum: [CDI, IPCA, SELIC, TREASURY_PU, ETTJ, IPCA_PROJ, LISTED_CLOSE]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeriesIngestRunView"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: triggerAdminSeriesIngest
      summary: Dispara uma coleta (dev/teste). Agendamento de produção permanece desligado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesIngestTriggerRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesIngestRunView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Corrida RUNNING da mesma capacidade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/users/{userId}:
    patch:
      tags: [admin]
      operationId: updateAdminUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/subscriptions:
    get:
      tags: [admin]
      operationId: listAdminSubscriptions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSubscriptionView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/subscriptions/{subscriptionId}:
    patch:
      tags: [admin]
      operationId: updateAdminSubscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSubscriptionPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubscriptionView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/observability:
    get:
      tags: [admin]
      operationId: getAdminObservability
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminObservabilitySnapshot"
        "403":
          $ref: "#/components/responses/Forbidden"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PortfolioIds:
      name: portfolioIds
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uuid
      description: |
        Escopo de carteiras. Omitido = todas do usuário. Array vazio = 422 ERR_PORTFOLIO_SCOPE_EMPTY.
        Duplicados são deduplicados. Id de outro usuário ou inexistente = 404.
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Ticker:
      name: ticker
      in: path
      required: true
      schema:
        type: string
        examples: [VALE3]
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Forbidden (trial/gates/RBAC)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Decimal:
      type: string
      description: >
        Decimal como string (BR-005). Persistência NUMERIC(18,8) ROUND_HALF_UP.
        JSON pode omitir zeros à direita; o contrato é equivalência numérica até 8 casas.
        Serialização não arredonda abaixo de 8 casas nem oculta diferença nessa escala.
      examples: ["62.10000000", "7000"]
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: boolean
    ErrorEnvelope:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: >
            Inclui códigos de custódia em SELL/transfer sem IF (BR-047):
            ERR_CUSTODY_AMBIGUOUS (≥2 IFs elegíveis — exigir seleção),
            ERR_CUSTODY_SPLIT_REQUIRED (saldo total cobre mas nenhuma IF isolada),
            ERR_CUSTODY_INSUFFICIENT_TOTAL (soma das IFs < quantidade).
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
        requestId:
          type: string
          format: uuid
    Provenance:
      type: object
      required: [source, capturedAt, integrityIndex]
      properties:
        source:
          type: string
        capturedAt:
          type: string
          format: date-time
        integrityIndex:
          type: number
          minimum: 0
          maximum: 1
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthTokens:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [USER, AUDITOR, SUPPORT, SUPER_ADMIN]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
    BillingStatus:
      type: object
      required: [plan, status, writeEnabled]
      properties:
        plan:
          type: string
          enum: [CORE, EXPERT]
        status:
          type: string
          enum: [trialing, active, past_due, canceled, expired]
        writeEnabled:
          type: boolean
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        exportUntil:
          type: string
          format: date-time
          nullable: true
    Portfolio:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    PortfolioCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
    LedgerEventType:
      type: string
      enum:
        [
          BUY,
          SELL,
          BONUS,
          SPLIT,
          REVERSE_SPLIT,
          SUBSCRIPTION,
          AMORTIZATION,
          CUSTODY_TRANSFER,
          PORTFOLIO_TRANSFER_OUT,
          PORTFOLIO_TRANSFER_IN,
          INITIAL_POSITION,
        ]
    GrossAmountOrigin:
      type: string
      enum: [INFORMED, DERIVED]
      description: INFORMED = total informado; DERIVED = materializado de quantity × unitPrice na escala persistida (8 casas)
    PortfolioTransferCreate:
      type: object
      required: [toPortfolioId, ticker, quantity, tradeDate]
      properties:
        toPortfolioId:
          type: string
          format: uuid
        ticker:
          type: string
        quantity:
          $ref: "#/components/schemas/Decimal"
        tradeDate:
          type: string
          format: date
        custodian:
          type: string
          description: >
            Opcional. Omitido → mesma resolução BR-047 que SELL
            (único/auto, ambíguo, split required, insuficiente total).
    PortfolioTransferResult:
      type: object
      required: [transferPairId, out, in]
      properties:
        transferPairId:
          type: string
          format: uuid
        out:
          $ref: "#/components/schemas/Transaction"
        in:
          $ref: "#/components/schemas/Transaction"
    UserConsolidatedWealth:
      allOf:
        - $ref: "#/components/schemas/PortfolioWealth"
        - type: object
          required: [portfolioCount, scope]
          properties:
            portfolioCount:
              type: integer
            scope:
              $ref: "#/components/schemas/WealthScope"
            coverage:
              $ref: "#/components/schemas/WealthCoverage"
            analyticsUnavailableReason:
              type: string
              nullable: true
              description: |
                Presente quando TWR/MWRR (ou risco) não são calculados neste escopo.
                Ex.: CONSOLIDATED_RECALC_PENDING — requisito futuro, não regra permanente.
    WealthScope:
      type: object
      required: [mode, portfolioIds]
      properties:
        mode:
          type: string
          enum: [single, subset, all]
        portfolioIds:
          type: array
          items:
            type: string
            format: uuid
    WealthCoverage:
      type: object
      required: [partialCoverage]
      properties:
        quotesAsOf:
          type: string
          format: date
          nullable: true
        quoteSource:
          type: string
          nullable: true
          description: Fonte da cotação usada na avaliação (ex. B3 close)
        partialCoverage:
          type: boolean
          description: true somente com lacuna real (ex. cotação ausente); datas de início distintas entre carteiras não bastam
        portfolios:
          type: array
          items:
            type: object
            required: [portfolioId]
            properties:
              portfolioId:
                type: string
                format: uuid
              historyFrom:
                type: string
                format: date
                nullable: true
                description: Primeira movimentação da carteira (informativo)
    ScopedPositionsResponse:
      type: object
      required: [scope, positions, coverage]
      properties:
        scope:
          $ref: "#/components/schemas/WealthScope"
        coverage:
          $ref: "#/components/schemas/WealthCoverage"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/ConsolidatedEnrichedPosition"
    ConsolidatedEnrichedPosition:
      type: object
      required: [assetId, ticker, assetClass, quantity, costKnown, breakdown]
      properties:
        assetId:
          type: string
          format: uuid
        ticker:
          type: string
        assetClass:
          $ref: "#/components/schemas/AssetClass"
        quantity:
          $ref: "#/components/schemas/Decimal"
        costBasis:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: Null quando costKnown=false (custo ausente em alguma fatia; não coerce a zero)
        costKnown:
          type: boolean
        avgCost:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: PM consolidado só quando costKnown e quantity > 0
        marketValue:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioPositionSlice"
    PortfolioPositionSlice:
      type: object
      required: [portfolioId, portfolioName, quantity, costKnown]
      properties:
        portfolioId:
          type: string
          format: uuid
        portfolioName:
          type: string
        quantity:
          $ref: "#/components/schemas/Decimal"
        costBasis:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        costKnown:
          type: boolean
        marketValue:
          $ref: "#/components/schemas/Decimal"
          nullable: true
    ScopedReconcileResult:
      type: object
      required: [jobs, failed]
      properties:
        jobs:
          type: array
          items:
            type: object
            required: [portfolioId, jobId, status]
            properties:
              portfolioId:
                type: string
                format: uuid
              jobId:
                type: string
              status:
                type: string
                enum: [pending, processing, completed, failed, interrupted]
        failed:
          type: array
          items:
            type: object
            required: [portfolioId, error]
            properties:
              portfolioId:
                type: string
                format: uuid
              error:
                type: string
    Transaction:
      type: object
      required: [id, portfolioId, ticker, eventType, quantity, unitPrice, costs, tradeDate]
      properties:
        id:
          type: string
          format: uuid
        portfolioId:
          type: string
          format: uuid
        ticker:
          type: string
        assetClass:
          $ref: "#/components/schemas/AssetClass"
          description: Classe do ativo no catálogo (join assets)
        eventType:
          $ref: "#/components/schemas/LedgerEventType"
        quantity:
          $ref: "#/components/schemas/Decimal"
        unitPrice:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: Null quando costBasisUnknown (sentinela 0 na persistência nunca é PM)
        costs:
          $ref: "#/components/schemas/Decimal"
        costBasisUnknown:
          type: boolean
          description: true em INITIAL_POSITION sem PM; unitPrice 0 não é custo conhecido
        grossAmount:
          $ref: "#/components/schemas/Decimal"
          description: Total bruto antes dos custos. Null em compras legadas.
        grossAmountOrigin:
          $ref: "#/components/schemas/GrossAmountOrigin"
          nullable: true
        grossAmountScaleWarning:
          type: string
          description: Presente quando 0 < |quantize8(q×p) − grossAmount| < 0.01
        tradeDate:
          type: string
          format: date
        custodian:
          type: string
          description: >
            Rótulo de corretora/custódia (BUY/SELL). Em SELL, se omitido:
            IF única elegível é inferida; ambígua → ERR_CUSTODY_AMBIGUOUS;
            distribuída → ERR_CUSTODY_SPLIT_REQUIRED; total insuficiente →
            ERR_CUSTODY_INSUFFICIENT_TOTAL (BR-047).
        fromCustodian:
          type: string
          description: Origem (CUSTODY_TRANSFER)
        toCustodian:
          type: string
          description: Destino (CUSTODY_TRANSFER)
        reversesTransactionId:
          type: string
          format: uuid
          description: Estorno append-only referenciando transação original
    TransactionCreate:
      type: object
      required: [ticker, eventType, quantity, unitPrice, tradeDate]
      properties:
        ticker:
          type: string
        eventType:
          $ref: "#/components/schemas/LedgerEventType"
        quantity:
          $ref: "#/components/schemas/Decimal"
        unitPrice:
          $ref: "#/components/schemas/Decimal"
        costs:
          $ref: "#/components/schemas/Decimal"
          default: "0"
        grossAmount:
          $ref: "#/components/schemas/Decimal"
          description: Total bruto antes dos custos (BUY/SUBSCRIPTION). Ausente → DERIVED de q×p.
        grossAmountOrigin:
          $ref: "#/components/schemas/GrossAmountOrigin"
        confirmGrossDivergence:
          type: boolean
          description: Obrigatório quando |quantize8(q×p) − grossAmount| ≥ 0.01
        tradeDate:
          type: string
          format: date
        custodian:
          type: string
        fromCustodian:
          type: string
        toCustodian:
          type: string
        reversesTransactionId:
          type: string
          format: uuid
        costBasisUnknown:
          type: boolean
          description: Posição inicial sem PM conhecido (não inventa custo zero)
    TransactionUpdate:
      type: object
      properties:
        ticker:
          type: string
        eventType:
          $ref: "#/components/schemas/LedgerEventType"
        quantity:
          $ref: "#/components/schemas/Decimal"
        unitPrice:
          $ref: "#/components/schemas/Decimal"
        costs:
          $ref: "#/components/schemas/Decimal"
        grossAmount:
          $ref: "#/components/schemas/Decimal"
          description: Total efetivo. Obrigatório se quantity ou unitPrice mudarem.
        grossAmountOrigin:
          $ref: "#/components/schemas/GrossAmountOrigin"
        confirmGrossDivergence:
          type: boolean
        tradeDate:
          type: string
          format: date
        custodian:
          type: string
          nullable: true
        fromCustodian:
          type: string
          nullable: true
        toCustodian:
          type: string
          nullable: true
    TransactionMove:
      type: object
      required: [toPortfolioId]
      properties:
        toPortfolioId:
          type: string
          format: uuid
    Position:
      type: object
      required: [ticker, quantity, freeQuantity, costKnown]
      properties:
        ticker:
          type: string
        quantity:
          $ref: "#/components/schemas/Decimal"
        avgCost:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: Null quando costKnown=false; sentinela persistida 0 não é PM
        costKnown:
          type: boolean
        unknownQuantity:
          $ref: "#/components/schemas/Decimal"
        knownQuantity:
          $ref: "#/components/schemas/Decimal"
        knownTotalCost:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        freeQuantity:
          $ref: "#/components/schemas/Decimal"
        marketPrice:
          $ref: "#/components/schemas/Decimal"
        marketPriceProvenance:
          $ref: "#/components/schemas/Provenance"
        unrealizedPnl:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: Null se costKnown=false; senão (marketPrice − avgCost) × quantity quando há close
        assetClass:
          $ref: "#/components/schemas/AssetClass"
        marketValue:
          $ref: "#/components/schemas/Decimal"
        costBasis:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        weightPercent:
          $ref: "#/components/schemas/Decimal"
          description: Peso no patrimônio total (RV + Tesouro + carrego RF)
        weightClassPercent:
          $ref: "#/components/schemas/Decimal"
        weightSectorPercent:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        sector:
          type: string
          nullable: true
        dividendYield:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        yocPercent:
          $ref: "#/components/schemas/Decimal"
          nullable: true
        pl:
          $ref: "#/components/schemas/Decimal"
          nullable: true
          description: P/L múltiplo; omitido se LPA ≤ 0 (BR-039)
        devaluation:
          type: boolean
          description: true se close &lt; PM (BR-305)
        quantityByCustodian:
          type: array
          items:
            $ref: "#/components/schemas/CustodianQuantity"
