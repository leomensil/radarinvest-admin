          $ref: "#/components/schemas/FixedIncomeDayCount"
          description: Padrão BUSINESS_252; outros 422 UNSUPPORTED_DAY_COUNT
        issueDate:
          type: string
          format: date
        startDate:
          type: string
          format: date
        maturityDate:
          type: string
          format: date
        gracePeriodDate:
          type: string
          format: date
