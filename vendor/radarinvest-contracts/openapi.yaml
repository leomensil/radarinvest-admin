openapi: 3.1.0
info:
  title: RadarInvest API
  version: 0.8.32
  description: >
    Contrato canônico Core (MVP). Implementado por radarinvest-api.
    Decimal monetário como string. Provenance obrigatória em métricas (BR-010).
    CSV/XLSX canônico de import (RF04): Ticker;Evento;Quantidade;Preço;Custos;Data;Instituição
    (C/V, números BR, data DD/MM/AAAA). Legado EN: ticker,eventType,...,tradeDate[,custodian].
servers:
  - url: https://api.radarinvest.app.br
    description: production
  - url: http://localhost:3001
    description: local
tags:
  - name: health
  - name: auth
  - name: billing
  - name: portfolios
  - name: transactions
  - name: positions
  - name: imports
  - name: assets
  - name: institutions
  - name: dividends
  - name: valuation
  - name: radar
  - name: suitability
  - name: gates
  - name: export
  - name: treasury
  - name: fixed-income
  - name: tax
  - name: risk
  - name: options
  - name: allocation
  - name: watchlist
  - name: market
  - name: privacy
  - name: ai
  - name: admin
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [health]
      security: []
      operationId: getHealthz
      summary: Healthcheck simples
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/liveness:
    get:
      tags: [health]
      security: []
      operationId: getLiveness
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/readiness:
    get:
      tags: [health]
      security: []
      operationId: getReadiness
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/register:
    post:
      tags: [auth]
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      operationId: refresh
      summary: Refresh via cookie HttpOnly (corpo opcional)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /billing/status:
    get:
      tags: [billing]
      operationId: getBillingStatus
      responses:
        "200":
          description: Trial/subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"

  /portfolios:
    get:
      tags: [portfolios]
      operationId: listPortfolios
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Portfolio"
    post:
      tags: [portfolios]
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "403":
          $ref: "#/components/responses/Forbidden"

  /me/wealth:
    get:
      tags: [portfolios]
      operationId: getUserConsolidatedWealth
      summary: Patrimônio consolidado do escopo selecionado (RF41)
      description: |
        Escopo via `portfolioIds`: omitido = todas as carteiras do usuário;
        array vazio = 422 ERR_PORTFOLIO_SCOPE_EMPTY; duplicados são deduplicados;
        id não autorizado/inexistente = 404. Não interpreta lista vazia como "todas".
      parameters:
        - $ref: "#/components/parameters/PortfolioIds"
        - name: includeSeries
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Quando false (padrão), não calcula série histórica (resposta com series vazia).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConsolidatedWealth"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"


  /me/returns:
    get:
      tags: [portfolios]
      operationId: getUserScopedReturns
      summary: Rentabilidade TWR/MWRR do escopo (RF47 / BR-022 / BR-227)
      description: |
        Recalcula no perímetro single/subset/all. Não média de %.
        `mwrrSimplePercent` ≠ TIR; TIR em `mwrrIrrPercent`.
        Mesmo `portfolioIds` que `/me/wealth`.
      parameters:
        - $ref: "#/components/parameters/PortfolioIds"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopedPortfolioReturns"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /me/positions:
    get:
      tags: [positions]
      operationId: listScopedEnrichedPositions
      summary: Posições agregadas do escopo com breakdown por carteira (RF41)
      parameters:
        - $ref: "#/components/parameters/PortfolioIds"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopedPositionsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /me/reconcile:
    post:
      tags: [transactions]
      operationId: reconcileScopedPortfolios
      summary: Conciliação em lote do escopo (um job por carteira)
      description: |
        Enfileira reconcile individual por carteira do escopo. Falha ao aceitar
        um job não cancela os demais já aceitos (falhas parciais em `failed`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                portfolioIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Omitido = todas; [] = 422 ERR_PORTFOLIO_SCOPE_EMPTY
      responses:
        "202":
          description: Accepted (jobs criados; ver failed para rejeições parciais)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopedReconcileResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /portfolios/{portfolioId}/reconcile:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    post:
      tags: [transactions]
      operationId: reconcilePortfolio
      summary: Dispara conciliação assíncrona do livro-razão com relatório de divergências
      responses:
        "202":
          description: Accepted (Job de conciliação criado)
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status]
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
                    enum: [pending, processing, completed, failed, interrupted]
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflito (já existe conciliação em processamento para esta carteira)

  /portfolios/{portfolioId}/reconcile/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
      - name: jobId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [transactions]
      operationId: getReconcileJob
      summary: Consulta status e relatório de job de conciliação
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, portfolioId, status, createdAt]
                properties:
                  id:
                    type: string
                  portfolioId:
                    type: string
                  status:
                    type: string
                    enum: [pending, processing, completed, failed, interrupted]
                  createdAt:
                    type: string
                  completedAt:
                    type: string
                  error:
                    type: string
                  report:
                    type: object
        "404":
          description: Job não encontrado

  /portfolios/{portfolioId}/transfers:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    post:
      tags: [transactions]
      operationId: createPortfolioTransfer
      summary: Transferência entre carteiras do usuário (RF40)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioTransferCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioTransferResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /portfolios/{portfolioId}/transactions:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [transactions]
      operationId: listTransactions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      tags: [transactions]
      operationId: createTransaction
      summary: Append ledger event (BR-002)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /portfolios/{portfolioId}/transactions/{transactionId}:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
      - $ref: "#/components/parameters/TransactionId"
    patch:
      tags: [transactions]
      operationId: updateTransaction
      summary: Edit ledger event (BR-002); recomputa posição do ativo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [transactions]
      operationId: deleteTransaction
      summary: Hard delete ledger event when replay remains valid (BR-002)
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /portfolios/{portfolioId}/transactions/{transactionId}/move:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
      - $ref: "#/components/parameters/TransactionId"
    post:
      tags: [transactions]
      operationId: moveTransaction
      summary: Relocate event to another portfolio of the same user (≠ RF40)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionMove"
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /portfolios/{portfolioId}/positions:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [positions]
      operationId: listPositions
      responses:
        "200":
          description: Derived positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /portfolios/{portfolioId}/assets/{ticker}/custody:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
      - $ref: "#/components/parameters/Ticker"
      - name: asOf
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Data de corte (inclusive). Omitido = hoje.
    get:
      tags: [positions]
      operationId: listAssetCustody
      summary: Saldo por IF do ativo (replayCustody, BR-006/BR-047)
      responses:
        "200":
          description: IFs com quantidade > 0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetCustodyBucket"
        "404":
          $ref: "#/components/responses/NotFound"

  /portfolios/{portfolioId}/returns:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [positions]
      operationId: getPortfolioReturns
      summary: TWR e MWRR segregados (BR-022)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioReturns"

  /portfolios/{portfolioId}/wealth:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [positions]
      operationId: getPortfolioWealth
      summary: Consolidação patrimonial e série (RF38)
      parameters:
        - name: includeSeries
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Quando false (padrão), não calcula série histórica (resposta com series vazia).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioWealth"

  /portfolios/{portfolioId}/imports:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    post:
      tags: [imports]
      operationId: createImportJob
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  type: string
                  enum: [SINACOR_PDF, CSV, XLSX]
                ledgerMode:
                  type: string
                  enum: [historical, initial_position]
                  description: historical = movimentações; initial_position = snapshot no fechamento da sessão de cutDate (calendário/fuso do domínio; não 23:59:59.999Z)
                cutDate:
                  type: string
                  format: date
                  description: Data civil YYYY-MM-DD do fechamento da sessão (obrigatório se ledgerMode=initial_position). Comparação tradeDate <= cutDate; sem conversão a instante UTC.
                confirmEmbeddedHistory:
                  type: string
                  description: Não autoriza merge. Histórico com tradeDate <= cutDate no mesmo ativo responde 422 CONFLICT_EMBEDDED_HISTORY (manter snapshot XOR reconstruir pelo histórico). True não soma nem substitui.
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"

  /portfolios/{portfolioId}/imports/{jobId}:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [imports]
      operationId: getImportJob
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"

  /portfolios/{portfolioId}/imports/{jobId}/map:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [imports]
      operationId: mapImportJob
      summary: Aplica mapeamento de colunas e gera preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportColumnMappingRequest"
      responses:
        "200":
          description: Preview gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /portfolios/{portfolioId}/imports/{jobId}/commit:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [imports]
      operationId: commitImportJob
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "403":
          $ref: "#/components/responses/Forbidden"

  /institutions/b3:
    get:
      tags: [institutions]
      operationId: searchB3Institutions
      summary: Busca IFs ativas do catálogo B3 (AD-025)
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Trecho de code ou name (case-insensitive)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancialInstitution"

  /assets/search:
    get:
      tags: [assets]
      operationId: searchAssets
      summary: Autocomplete ticker (mín. 3 caracteres)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: assetClass
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssetClass"
          description: Quando informado, restringe resultados à classe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetSearchHit"

  /assets/compare:
    get:
      tags: [assets]
      operationId: compareAssets
      summary: Comparativo mesma classe (RF43)
      parameters:
        - name: tickers
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCompareResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /assets/{ticker}:
    parameters:
      - $ref: "#/components/parameters/Ticker"
    get:
      tags: [assets]
      operationId: getAsset
      responses:
        "200":
          description: Asset sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetSheet"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{ticker}/closes:
    parameters:
      - $ref: "#/components/parameters/Ticker"
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
    get:
      tags: [assets]
      operationId: listAssetCloses
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceClose"

  /portfolios/{portfolioId}/dividends:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [dividends]
      operationId: listPortfolioDividends
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DividendView"
  /portfolios/{portfolioId}/dividends/{dividendId}/receipts:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
      - name: dividendId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [dividends]
      operationId: confirmDividendReceipt
      summary: Confirma crédito individual na carteira (idempotente)
      responses:
        "201":
          description: Recibo criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DividendReceipt"
        "200":
          description: Recibo já existia (idempotente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DividendReceipt"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portfolios/{portfolioId}/yoc:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [dividends]
      operationId: listYieldOnCost
      responses:
        "200":
          description: YoC por ativo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YieldOnCost"

  /portfolios/{portfolioId}/dividends/seasonality:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [dividends]
      operationId: getDividendSeasonality
      summary: Matriz mês × ticker de proventos creditados (RF12)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DividendSeasonality"

  /portfolios/{portfolioId}/dividends/projection:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [dividends]
      operationId: getDividendProjection
      summary: Projeção a partir de proventos ANNOUNCED (RF13 / BR-103)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DividendProjection"

  /market/ettj/nss/latest:
    get:
      tags: [market]
      operationId: getLatestEttjNss
      summary: Parâmetros NSS ANBIMA mais recentes (curva curada)
      parameters:
        - name: curveKind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/EttjCurveKind"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EttjNssView"
        "404":
          description: Série ausente

  /portfolios/{portfolioId}/treasury:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [treasury]
      operationId: listTreasuryPositions
      summary: Visão legada agregado (espécies não migradas) + dual PU (RF26 / BR-023)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreasuryView"

  /portfolios/{portfolioId}/treasury/lots:
    parameters:
      - $ref: "#/components/parameters/PortfolioId"
    get:
      tags: [treasury]
      operationId: listTreasuryLots
      summary: Lotes Tesouro (PREFIXADO_ZERO §6a / SELIC §6b / IPCA_PLUS §6c)
      parameters:
        - name: asOf
          in: query
          schema:
            type: string
